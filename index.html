[["In accounting, assets equal…",["Liabilities plus equity","Revenue minus expenses","Cash only"],0],["CTR stands for…",["Click-Through Rate","Cost To Retain","Customer Trust Rating"],0]],[["Ohm’s law gives voltage as…",["Current × resistance","Current ÷ resistance","Resistance ÷ current"],0],["The SI unit of force is the…",["Newton","Joule","Watt"],0]],
[["The inverted pyramid in news writing puts…",["Key facts first","Opinion first","Background first"],0],["RGB colour mode is designed for…",["Screens","Ink printing","Engraving"],0]],[["Civil cases in the US usually require proof by…",["Preponderance of the evidence","Beyond reasonable doubt","Unanimous consent"],0],["Client self-determination means…",["Clients make their own informed choices","Workers decide for clients","Courts decide everything"],0]],
[["In the STAR method, R stands for…",["Result","Role","Reason"],0],["What does ATS stand for in hiring?",["Applicant Tracking System","Automated Test Suite","Annual Tax Statement"],0],["Typical early-career US CV length?",["One page","Five pages","One paragraph"],0],["A strong closing interview question asks about…",["Success in the role","Only holidays","Nothing at all"],0]]];
const D={easy:{n:"Easy",need:40,iv:50,sk:4},normal:{n:"Normal",need:50,iv:60,sk:3},hard:{n:"Hard",need:60,iv:70,sk:2}};
const OUT=["Everyday wear","Smart casual","Blazer","Tailored suit"],CO=["Northfield Group","Brightwater","Orchid Labs","Lumen & Co","Harbor Partners","Vertex Works","Cedar Systems","Atlas Collective","Kite & Pine","Meridian Hall","Summit Row","Alder Institute"],LOC=["Remote","New York, NY","Austin, TX","Chicago, IL","Seattle, WA","Denver, CO","Atlanta, GA","Boston, MA"],LV=[["Entry-level",.75,0],["Associate",.92,1],["Senior",1.15,3]];
const SH=[["course","Add a course to your CV","+6 knowledge and +1 starting skill",30],["exp","Add experience","+1 year of experience on your CV",40],["ref","Add a referral","One referral to boost an application (+12)",25],["outfit","Better interview outfit","Each level adds confidence points",35],["prac","Pro practice pack","Model answers after each interview question",50]];
let M={credits:0,up:{course:0,exp:0,ref:0,outfit:0,prac:0},flag:[],best:0};try{M=Object.assign(M,JSON.parse(localStorage.getItem("hm2")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("hm2",JSON.stringify(M))}catch(e){}};
let S=null,scr="menu",tab="jobs",SP,sel={pi:0,df:"normal"},rec;
async function ai(p){try{if(SP===undefined)SP=window.claude&&claude.use?await claude.use("sample"):null;if(!SP)return null;return await SP.json(p,{modelTier:"quick",cache:false})}catch(e){return null}}
function toast(t){const d=document.createElement("div");d.className="tm";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2400)}
function conf(){for(let i=0;i<30;i++){const d=document.createElement("div");d.className="fx";d.style.background=pick(["#1d4ed8","#0f7a46","#d97706","#b42318","#7c3aed"]);d.style.left=R(0,98)+"%";d.style.animationDelay=Math.random()*.8+"s";document.body.append(d);setTimeout(()=>d.remove(),3500)}}
const go=(s,t)=>{scr=s;if(t)tab=t;render();scrollTo(0,0)};
function gen(){S.jobs=S.jobs.filter(j=>j.flag);J.forEach((p,pi)=>{for(let k=0;k<2;k++){const l=pick(LV);S.jobs.push({id:S.day+"-"+pi+"-"+k,t:l[0]+" "+p[0],c:p[1],lv:l[0],co:pick(CO),loc:pick(LOC),pay:Math.round(p[2]*l[1]*(.88+Math.random()*.24)),req:shuf(sk(pi)).slice(0,3),min:l[2]})}})}
function start(){const s=shuf(sk(sel.pi));S={pi:sel.pi,df:sel.df,day:1,exp:R(0,1)+M.up.exp,know:10+M.up.course*6,skills:s.slice(0,D[sel.df].sk+M.up.course),sum:"Motivated candidate keen to learn and contribute.",ref:M.up.ref,apps:[],jobs:M.flag.map(j=>({...j,id:"f"+R(1,1e9),flag:1})),offers:[],ivs:0,trOk:0,st:0,learned:0,tl:"",ju:null,ur:false,asked:[],q:"",fc:"all",fl:"all",so:"new",ce:false};M.flag=[];save();S.cv=S.skills.slice(0,5);gen();go("hub","jobs")}
function bk(j,tl,ur){const tx=(tl||"").toLowerCase(),has=j.req.filter(r=>S.cv.includes(r)).length,kw=j.req.filter(r=>S.skills.includes(r)&&tx.includes(r.toLowerCase())).length,lie=j.req.filter(r=>!S.skills.includes(r)&&tx.includes(r.toLowerCase())).length;return{Skills:has/3*45,Tailoring:Math.max(0,kw/3*20-lie*10),Experience:(j.min?Math.min(S.exp/j.min,1):1)*15,Knowledge:Math.min(S.know,100)/100*10,Referral:ur?12:0,Exaggeration:-lie*10}}
const tot=(b,j)=>Object.values(b).reduce((a,c)=>a+c,0)+(j.flag?8:0),MX={Skills:45,Tailoring:20,Experience:15,Knowledge:10};
function vMenu(){return`<div style="padding:40px 0 10px"><div class="brand" style="font-size:1.3rem">Short<i>list</i></div><h1>The job hunt simulator.</h1><p class="m" style="max-width:520px">Build a CV, tailor it to real-world roles, survive adaptive interviews and land the offer. You apply for jobs, you never work them.</p></div>
<div class="card row sp"><span><b>${M.best}</b> <span class="m">best score</span></span><span><b>${M.credits}</b> <span class="m">credits</span></span>${M.flag.length?`<span class="pill i">${M.flag.length} flagged job(s) return next game</span>`:""}</div><button onclick="go('setup')">New game</button> <button class="g" onclick="go('shop')">Career shop</button>`}
function vSetup(){const p=J[sel.pi];return`<h2>Choose your profile</h2><p class="m">Your background sets the skills on your CV. The job market is open to everyone, so you decide where to apply.</p><div class="card"><label class="m">Your profession</label><select onchange="sel.pi=+this.value;render()">${CAT.map((c,ci)=>`<optgroup label="${c}">${J.map((x,i)=>x[1]==ci?`<option value="${i}" ${i==sel.pi?"selected":""}>${x[0]}</option>`:"").join("")}</optgroup>`).join("")}</select><p class="m">Median US pay is roughly $${p[2]}k a year (approximate, BLS-based).</p>${sk(sel.pi).map(s=>`<span class="chip">${s}</span>`).join("")}</div>
<h2>Difficulty</h2><div class="row">${Object.entries(D).map(([k,d])=>`<button class="${sel.df==k?"":"g"}" onclick="sel.df='${k}';render()">${d.n}</button>`).join("")}</div><p class="m">Harder means fewer starting skills and stricter recruiters and interviewers.</p><button onclick="start()">Start</button> <button class="g" onclick="go('menu')">Back</button>`}
function vShop(){return`<h2>Career shop</h2><p>You have <b>${M.credits}</b> credits. Upgrades carry into every future game.</p>${SH.map(([k,t,d,c])=>{const lv=M.up[k],pr=k=="outfit"?c*(lv+1):c,mx=k=="outfit"?3:k=="prac"?1:99;return`<div class="card row sp"><div><b>${t}</b><div class="m">${d} · ${k=="outfit"?"now: "+OUT[lv]:"owned: "+lv}</div></div><button ${M.credits<pr||lv>=mx?"disabled":""} onclick="buy('${k}',${pr})">${lv>=mx?"Maxed":pr+" credits"}</button></div>`}).join("")}<button class="g" onclick="go('menu')">Back</button>`}
function buy(k,p){M.credits-=p;M.up[k]++;save();toast("Upgrade purchased");render()}
function vHub(){const nw=S.apps.filter(a=>a.st=="iv").length,pend=S.apps.filter(a=>a.st=="pend").length,T=[["jobs","Jobs"],["cv","My CV"],["tr","Trivia"],["in","Inbox"+(nw?" ("+nw+")":"")]];
return`<div class="top"><div class="brand">Short<i>list</i></div><span class="m">${J[S.pi][0]} · Day ${S.day} · ${D[S.df].n}</span></div><div class="stats"><div class="stat">Knowledge<b>${S.know}/100</b></div><div class="stat">Experience<b>${S.exp} yr</b></div><div class="stat">Outfit<b>${OUT[M.up.outfit]}</b></div><div class="stat">Referrals<b>${S.ref}</b></div></div>
<div class="tabs">${T.map(([k,l])=>`<button class="${tab==k?"a":""}" onclick="tab='${k}';render()">${l}</button>`).join("")}</div>${({jobs:tJobs,cv:tCv,tr:tTr,in:tIn})[tab]()}
${S.ce?`<div class="card"><b>End this game and bank your credits?</b><div class="row" style="margin-top:8px"><button onclick="endGame()">Yes, end game</button><button class="g" onclick="S.ce=false;render()">Keep playing</button></div></div>`:`<div class="row sp" style="margin-top:14px"><button onclick="nextDay()">Next day${pend?" ("+pend+" replies due)":""}</button><button class="bd" onclick="S.ce=true;render();scrollTo(0,document.body.scrollHeight)">End game</button></div>`}`}
function tJobs(){return`<div class="flt"><input id="q" placeholder="Search job title, company, skill or field" value="${esc(S.q)}" oninput="S.q=this.value;upd()"><select onchange="S.fc=this.value;upd()"><option value="all">All fields</option>${CAT.map((c,i)=>`<option value="${i}" ${S.fc==i&&S.fc!="all"?"selected":""}>${c}</option>`).join("")}</select><select onchange="S.fl=this.value;upd()"><option value="all">All levels</option>${LV.map(l=>`<option ${S.fl==l[0]?"selected":""}>${l[0]}</option>`).join("")}</select><select style="grid-column:1/-1" onchange="S.so=this.value;upd()"><option value="new">Sort: default</option><option value="pay" ${S.so=="pay"?"selected":""}>Sort: highest pay</option></select></div><div id="jl">${jl()}</div>`}
const upd=()=>{$("#jl").innerHTML=jl()};
function jl(){const q=S.q.toLowerCase();let a=S.jobs.filter(j=>(S.fc=="all"||j.c==S.fc)&&(S.fl=="all"||j.lv==S.fl)&&(!q||(j.t+" "+j.co+" "+j.req.join(" ")+" "+CAT[j.c]).toLowerCase().includes(q)));if(S.so=="pay")a=[...a].sort((x,y)=>y.pay-x.pay);
return`<div class="m" style="margin:8px 0">${a.length} of ${S.jobs.length} openings</div>`+(a.map(j=>{const d=S.apps.some(x=>x.j.id==j.id);return`<div class="card job">${mono(j.co)}<div class="jb"><div class="row sp"><b>${esc(j.t)}</b><b class="pay">$${j.pay}k</b></div><div class="m">${esc(j.co)} · ${j.loc} · ${CAT[j.c]} · ${j.min?j.min+"+ yrs":"No experience needed"}${j.flag?" · Flagged":""}</div><div>${j.req.map(r=>`<span class="chip ${S.cv.includes(r)?"y":""}">${r}</span>`).join("")}</div><button style="margin-top:6px" ${d?"disabled":""} onclick="openApply('${j.id}')">${d?"Applied":"Apply"}</button></div></div>`}).join("")||`<div class="card m">No openings match your search.</div>`)}
function tCv(){return`<div class="card"><b>Skills on your CV</b> <span class="m">(tap to toggle, max 5)</span><div style="margin-top:6px">${S.skills.map(s=>`<span class="chip ${S.cv.includes(s)?"on":"off"}" onclick="tg('${s}')">${s}</span>`).join("")}</div><p class="m">Recruiters only see skills on your CV. Highlighted skills on a job card are ones on your CV. Learn new skills through trivia.</p></div><div class="card"><b>Summary</b><textarea id="sum" rows="3" onchange="S.sum=this.value">${esc(S.sum)}</textarea><p class="m">${S.exp} year(s) experience · knowledge ${S.know}/100 · ${S.ref} referral(s)</p></div>`}
function tg(s){const i=S.cv.indexOf(s);if(i>=0)S.cv.splice(i,1);else if(S.cv.length<5)S.cv.push(s);else toast("Max 5 skills on a CV");render()}
const ST={pend:["Pending","pill"],iv:["Interview invite","pill i"],rej:["Not moving forward","pill x"],fail:["Rejected after interview","pill x"],offer:["Offer","pill o"]};
function tIn(){if(!S.apps.length)return`<div class="card m">No applications yet. Apply to jobs, then press Next day.</div>`;return S.apps.map((a,i)=>[a,i]).reverse().map(([a,i])=>`<div class="card job">${mono(a.j.co)}<div class="jb"><div class="row sp"><b>${esc(a.j.t)}</b><span class="${ST[a.st][1]}">${ST[a.st][0]}${a.st=="offer"?" $"+a.j.pay+"k":""}</span></div><div class="m">${esc(a.j.co)}</div>${a.st=="iv"?`<button style="margin-top:6px" onclick="beginIv(${i})">Attend interview</button>`:a.st=="rej"||a.st=="fail"?`<button class="g" style="margin-top:6px" onclick="S.ra=${i};go('rej')">Analyse</button>`:""}</div></div>`).join("")}
function nextDay(){let n=0;S.apps.forEach(a=>{if(a.st!="pend")return;const b=a.b=bk(a.j,a.tl,a.ur),t=tot(b,a.j)+R(-8,8);if(t>=D[S.df].need)a.st="iv";else{a.st="rej";a.w=Object.keys(MX).sort((x,y)=>b[x]/MX[x]-b[y]/MX[y])[0]}n++});S.day++;gen();tab=n?"in":tab;toast(n?n+" repl"+(n>1?"ies":"y")+" received":"New openings posted");render()}
function openApply(id){S.ju=S.jobs.find(j=>j.id==id);S.tl="";S.ur=false;go("apply")}
function vApply(){const j=S.ju,b=bk(j,S.tl,S.ur),t=Math.round(tot(b,j));return`<div class="top"><div class="brand">Short<i>list</i></div></div><div class="card job">${mono(j.co)}<div class="jb"><b>${esc(j.t)}</b><div class="m">${esc(j.co)} · ${j.loc} · $${j.pay}k</div><div>${j.req.map(r=>`<span class="chip ${S.cv.includes(r)?"y":""}">${r}</span>`).join("")}</div></div></div>
<div class="card"><b>CV summary for this job</b><textarea id="tl" rows="5" oninput="S.tl=this.value">${esc(S.tl||S.sum)}</textarea><button class="g" style="margin-top:8px" onclick="tailor()">Tailor with AI</button><p class="m">Mirror the job’s keywords, but only for skills you truly have. Claiming skills you lack gets caught.</p></div>
<div class="card"><b>Estimated match: ${t}%</b> <span class="m">(about ${D[S.df].need} needed, plus luck)</span>${Object.keys(MX).map(k=>`<div class="m">${k}</div><div class="bar"><i style="width:${Math.max(0,b[k]/MX[k]*100)}%"></i></div>`).join("")}${b.Exaggeration?`<p style="color:var(--bad)">Exaggeration penalty: ${b.Exaggeration}</p>`:""}${S.ref?`<label><input type="checkbox" style="width:auto" ${S.ur?"checked":""} onchange="S.ur=this.checked;render()"> Use a referral (+12), ${S.ref} left</label>`:""}</div><button onclick="submitApp()">Submit application</button> <button class="g" onclick="go('hub','jobs')">Cancel</button>`}
async function tailor(){const j=S.ju,own=j.req.filter(r=>S.skills.includes(r));$("#tl").value="Tailoring…";const r=await ai(`Rewrite this CV summary in 2 sentences for a ${j.t} application at ${j.co}. Original: "${S.sum}". The candidate truly has ONLY these skills: ${S.skills.join(", ")}. Job keywords: ${j.req.join(", ")}. Use a job keyword ONLY if it is in the candidate's skill list; never invent skills. Return JSON only: {"text":"..."}`);S.tl=r&&r.text?r.text:`${J[S.pi][0]} with ${S.exp} year(s) of experience and hands-on strength in ${(own.length?own:S.skills.slice(0,2)).join(" and ")}, ready to contribute to ${j.co}.`;render()}
function submitApp(){S.apps.push({j:S.ju,tl:S.tl,ur:S.ur,st:"pend"});if(S.ur)S.ref--;toast("Application submitted");go("hub","jobs")}
const mk=(q,o,a,w)=>{const z=shuf(o.map((t,i)=>[t,i==a]));return{q,o:z.map(x=>x[0]),a:z.findIndex(x=>x[1]),why:w}};
async function nq(){S.tq={load:1};render();const c=J[S.pi][1],r=await ai(`Write one NEW multiple-choice trivia question for a ${J[S.pi][0]} candidate (topics: ${S.skills.join(", ")}), difficulty ${D[S.df].n}. One correct answer, 3 options. Do NOT repeat or paraphrase any of these: ${S.asked.join(" | ")||"none"}. Variety seed: ${Math.random().toString(36).slice(2,8)}. Return JSON only: {"q":"...","o":["a","b","c"],"a":0,"why":"one sentence"}`);
let t=r&&r.q&&Array.isArray(r.o)&&r.o.length>=3&&r.a>=0&&r.a<r.o.length&&!S.asked.includes(r.q)?mk(r.q,r.o,r.a,r.why):null;if(!t){const b=[...TR[c],...TR[8]],f=b.filter(x=>!S.asked.includes(x[0])),x=pick(f.length?f:b);t=mk(x[0],x[1],x[2])}S.asked.push(t.q);S.tq=t;render()}
function tTr(){const q=S.tq,h=`<div class="card row sp"><span><b>${S.trOk}</b> correct · streak <b>${S.st}</b></span><span class="m">Every 3 correct answers teaches a new skill</span></div>`;if(!q)return h+`<button onclick="nq()">Start trivia</button>`;if(q.load)return h+`<div class="dots"><span>●</span><span>●</span><span>●</span></div>`;
return h+`<div class="card"><b>${esc(q.q)}</b>${q.o.map((o,i)=>`<button class="opt ${q.d?(i==q.a?"r":i==q.p?"w":""):""}" ${q.d?"disabled":""} onclick="ansT(${i})">${esc(o)}</button>`).join("")}${q.d?`<p>${q.p==q.a?"Correct.":"Not quite."} ${esc(q.why||"")}</p><button onclick="nq()">Next question</button>`:""}</div>`}
function ansT(i){const q=S.tq;q.d=1;q.p=i;if(i==q.a){S.trOk++;S.st++;S.know=Math.min(100,S.know+3+Math.min(S.st,3));if(S.trOk%3==0){const n=[...sk(S.pi),...GEN].filter(s=>!S.skills.includes(s));if(n.length){const s=pick(n);S.skills.push(s);S.learned++;toast("New skill learned: "+s);conf()}}}else S.st=0;render()}
function beginIv(i){S.iv={a:S.apps[i],i:0,sc:[],qs:[],q:"",stage:"load"};go("iv");loadQ()}
async function loadQ(){const v=S.iv,j=v.a.j;v.stage="load";render();const avg=v.sc.length?v.sc.reduce((a,c)=>a+c)/v.sc.length:6,lv=D[S.df].n+(avg<5?"; candidate is struggling, ask something easier":avg>7.5?"; candidate is doing great, ask something harder":"");
const r=await ai(`You are a hiring manager at ${j.co} interviewing for ${j.t}. Required skills: ${j.req.join(", ")}. Difficulty: ${lv}. Question ${v.i+1} of 3. Already asked: ${v.qs.join(" | ")||"nothing"}. Ask ONE fresh, specific, non-generic question tied to this role. Return JSON only: {"q":"..."}`);
v.q=r&&r.q?r.q:[`Walk me through a time you used ${j.req[0]} to solve a real problem.`,`A colleague disagrees with your approach on a ${j.t.toLowerCase()} task. What do you do?`,`How would you prove your ${j.req[1]} ability to someone who has never seen your work?`][v.i];v.qs.push(v.q);v.stage="ans";render()}
function vIv(){const v=S.iv,j=v.a.j,b=`<div class="card job">${mono(j.co)}<div class="jb"><b>${esc(j.t)}</b><div class="m">${esc(j.co)} · Question ${v.i+1} of 3 · Outfit: ${OUT[M.up.outfit]}</div></div></div>`;
if(v.stage=="load")return b+`<div class="dots"><span>●</span><span>●</span><span>●</span></div>`;if(v.stage=="ans")return b+`<div class="card"><b>${esc(v.q)}</b></div><textarea id="ans" rows="5" placeholder="Type your answer, or tap Voice and speak…"></textarea><div class="row" style="margin-top:8px"><button class="g" onclick="mic()">Voice</button><button onclick="sendA()">Submit answer</button></div><p class="m">Tip: give context, your action and a specific result.</p>`;
return b+`<div class="card"><b>Score: ${v.s}/10</b><p>${esc(v.fb)}</p>${M.up.prac?`<p class="m">Model answer: ${esc(v.md)}</p>`:`<p class="m">The Pro practice pack in the shop unlocks model answers.</p>`}</div><button onclick="nextQ()">${v.i>=2?"Finish interview":"Next question"}</button>`}
function mic(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C){toast("Voice input is not supported here, please type");return}if(rec){rec.stop();rec=null;return}try{rec=new C();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;rec.onresult=e=>{$("#ans").value=[...e.results].map(x=>x[0].transcript).join(" ")};rec.onerror=()=>{toast("Microphone unavailable, please type");rec=null};rec.onend=()=>{rec=null};rec.start();toast("Listening. Tap Voice again to stop")}catch(e){toast("Microphone unavailable, please type")}}
async function sendA(){const v=S.iv,j=v.a.j,t=$("#ans").value.trim();if(rec){rec.stop();rec=null}if(t.length<8){toast("Say a little more");return}v.stage="load";render();
const r=await ai(`Interview question: "${v.q}". Candidate answer: "${t}". Role: ${j.t}. Strictness: ${D[S.df].n}. Rate 0-10 honestly (relevance, specifics, structure). Return JSON only: {"score":0,"fb":"one sentence of feedback","model":"a strong two-sentence sample answer"}`);
if(r&&typeof r.score=="number"){v.s=Math.max(0,Math.min(10,Math.round(r.score)));v.fb=r.fb||"Thanks for the answer.";v.md=r.model||""}else{const w=t.split(/\s+/).length,kw=j.req.filter(x=>t.toLowerCase().includes(x.toLowerCase())).length,st=["result","because","learned","team","example","improved"].filter(x=>t.toLowerCase().includes(x)).length;v.s=Math.max(0,Math.min(10,Math.round(w/10+kw*1.5+st*.8+(S.df=="easy"?1:S.df=="hard"?-1:0))));v.fb=v.s>=7?"Specific and well structured.":v.s>=4?"Decent, but add concrete detail and a measurable result.":"Too vague. Use context, action, result.";v.md=`Set the scene briefly, name ${j.req[0]} explicitly, describe what you did, and close with a measurable result.`}v.sc.push(v.s);v.stage="fb";render()}
function nextQ(){const v=S.iv;if(v.i>=2)fin();else{v.i++;loadQ()}}
function fin(){const v=S.iv,a=v.a,avg=v.sc.reduce((x,y)=>x+y)/v.sc.length,t=avg*10+M.up.outfit*3+S.know*.1;S.ivs++;scr="hub";tab="in";
if(t>=D[S.df].iv){a.st="offer";S.offers.push(a.j.pay);render();conf();toast("Offer received: $"+a.j.pay+"k")}else{a.st="fail";a.w="Interview";a.avg=avg.toFixed(1);render();$("#app").classList.add("shake");setTimeout(()=>$("#app").classList.remove("shake"),500);toast("Rejected after interview")}}
const WHY={Skills:["Your CV was missing key skills","Learn them in Trivia, then add them to your CV (max 5)."],Tailoring:["Your CV looked generic for this role","Use Tailor with AI and mirror the job keywords, truthfully."],Experience:["They wanted more experience","Buy experience in the shop and flag this job for a future game."],Knowledge:["Recruiters sensed knowledge gaps","Play more trivia before applying."],Interview:["Your interview answers were not convincing enough","Use context, action, result. Upgrade your outfit and buy the practice pack."]};
function vRej(){const a=S.apps[S.ra],w=WHY[a.w]||WHY.Skills,miss=a.j.req.filter(r=>!S.cv.includes(r));return`<div class="top"><div class="brand">Short<i>list</i></div></div><h2>Rejection analysis</h2><div class="card job">${mono(a.j.co)}<div class="jb"><b>${esc(a.j.t)}</b><div class="m">${esc(a.j.co)}</div></div></div><div class="card"><p><b>Main reason:</b> ${w[0]}${a.w=="Skills"&&miss.length?" ("+miss.join(", ")+")":""}${a.w=="Experience"?" ("+a.j.min+"+ yrs needed, you have "+S.exp+")":""}${a.avg?" (average answer "+a.avg+"/10)":""}.</p><p><b>How to fix it:</b> ${w[1]}</p></div><button onclick="flag(${S.ra})">Flag for a comeback next game</button> <button class="g" onclick="go('hub','in')">Back to inbox</button>`}
function flag(i){const j=S.apps[i].j;if(M.flag.some(f=>f.t==j.t&&f.co==j.co))toast("Already flagged");else{M.flag.push({...j,flag:1});save();toast("Flagged. It returns in your next game")}}
function endGame(){const best=Math.max(0,...S.offers),sc=Math.round(best*4+S.offers.length*25+S.ivs*15+S.trOk*8+S.learned*10);S.score=sc;S.cr=Math.floor(sc/8);M.credits+=S.cr;M.best=Math.max(M.best,sc);save();go("end");conf()}
function vEnd(){const sc=S.score,rk=sc>=700?"Dream Hire":sc>=450?"Offer Magnet":sc>=250?"Rising Candidate":sc>=100?"Getting Noticed":"Rookie Applicant";return`<div class="top"><div class="brand">Short<i>list</i></div></div><div style="padding:20px 0"><div class="m">Final score</div><div class="big">${sc}</div><h2>${rk}</h2></div><div class="card m">Best offer: $${Math.max(0,...S.offers)}k · Offers: ${S.offers.length} · Interviews: ${S.ivs} · Trivia correct: ${S.trOk} · Skills learned: ${S.learned}<br>Score = best offer ×4, +25 per offer, +15 per interview, +8 per trivia win, +10 per skill.</div><div class="card"><b>+${S.cr} credits earned</b> <span class="m">(total ${M.credits})</span>${M.flag.length?`<p class="m">${M.flag.length} flagged job(s) will return in your next game.</p>`:""}</div><button onclick="S=null;go('menu')">Back to home</button> <button class="g" onclick="go('shop')">Spend credits</button> <button class="g" onclick="go('setup')">New game</button>`}
function render(){$("#app").innerHTML=({menu:vMenu,setup:vSetup,shop:vShop,hub:vHub,apply:vApply,iv:vIv,rej:vRej,end:vEnd})[scr]()}
render();
</script></body></html>
